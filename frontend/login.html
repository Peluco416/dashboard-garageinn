<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GarageINN Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
    }
    .card {
      background: #1e293b;
      border-radius: 14px;
      padding: 40px 36px;
      width: 360px;
      box-shadow: 0 20px 60px #00000060;
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 { color: #38bdf8; font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; }
    .logo p  { color: #64748b; font-size: .8rem; margin-top: 4px; }

    label   { display: block; font-size: .75rem; color: #94a3b8; text-transform: uppercase;
              letter-spacing: .8px; margin-bottom: 6px; }
    input   { width: 100%; background: #0f172a; border: 1px solid #334155;
              border-radius: 8px; padding: 10px 14px; color: #f1f5f9;
              font-size: .95rem; outline: none; transition: border-color .2s; }
    input:focus { border-color: #38bdf8; }

    .field  { margin-bottom: 18px; }

    button {
      width: 100%; background: #38bdf8; color: #0f172a;
      border: none; border-radius: 8px; padding: 12px;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      transition: background .2s; margin-top: 6px;
    }
    button:hover { background: #7dd3fc; }

    .error {
      background: #ef444422; border: 1px solid #ef4444;
      color: #fca5a5; border-radius: 8px;
      padding: 10px 14px; font-size: .8rem;
      margin-bottom: 18px; display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>DASHBOARD VENDAS ONLINE</h1>
      <p>— GarageINN —</p>
    </div>

    <div class="error" id="error-msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('error-msg');
      errEl.classList.remove('show');

      const body = JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      });

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });

      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json();
        errEl.textContent = data.error || 'Erro ao fazer login';
        errEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
